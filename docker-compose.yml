services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  init-topic:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--create", "--if-not-exists", "--topic", "wiki-edits", "--partitions", "3", "--bootstrap-server", "kafka:19092"]
    restart: "no"

  producer:
    build: .
    command: ["python", "producer/producer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      init-topic:
        condition: service_completed_successfully
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "consumer/consumer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DB_PATH: /data/wiki.db
    volumes:
      - wikidata:/data
    depends_on:
      init-topic:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DB_PATH: /data/wiki.db
    volumes:
      - wikidata:/data
    ports:
      - "8501:8501"
    depends_on:
      init-topic:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafkadata:
  wikidata: